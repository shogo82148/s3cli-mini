name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - run: go mod download
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        continue-on-error: true
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::455234978633:role/s3cli-mini-TestRole6C9272DF-lZVVLYuG7Csz

      - name: Test
        run: |
          make test
        env:
          GO111MODULE: "on"
          S3CLI_TEST_BUCKET_PREFIX: ${{ secrets.S3CLI_TEST_BUCKET_PREFIX }}

      - name: Send coverage
        uses: shogo82148/actions-goveralls@v1.11.5
        with:
          path-to-profile: profile.cov
          parallel: true
          flag-name: ${{ matrix.os }}

  # notifies that all test jobs are finished.
  finish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: shogo82148/actions-goveralls@v1.11.5
        with:
          parallel-finished: true

  goreleaser-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check GoReleaser configure
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: "~> v2"
          args: check
